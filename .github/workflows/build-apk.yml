name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signierschluessel entschluesseln
        env:
          SOTTO_UNLOCK: ${{ secrets.SOTTO_UNLOCK }}
        run: |
          if [ -z "$SOTTO_UNLOCK" ]; then echo "::error::Secret SOTTO_UNLOCK fehlt"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/signing.enc -out /tmp/s.tar -pass env:SOTTO_UNLOCK
          tar -xf /tmp/s.tar && rm /tmp/s.tar
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Umbenennen
        run: |
          V=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/Sotto-$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-apk
          path: out/*.apk
      - name: Aufraeumen
        if: always()
        run: rm -rf keystore keystore.properties
